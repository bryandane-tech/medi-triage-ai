name: MediTriage CI/CD Pipeline

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  # ---------------------------------------------------------------------------
  # 1. C Execution Engine: Compilation, Warnings & Fuzz Test Sanity Check
  # ---------------------------------------------------------------------------
  c-engine-build:
    name: Build & Test C Engine
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Install Build Tools & AFL++
        run: |
          sudo apt-get update
          sudo apt-get install -y clang make afl++

      - name: Compile C Shared Library
        run: |
          cd c_engine
          make clean && make

      - name: Sanity Test Fuzzing Target
        run: |
          cd c_engine
          afl-gcc -O3 -Iinclude src/triage_engine.c fuzz/fuzz_triage.c -o fuzzer
          echo "chest pain, shortness of breath" | ./fuzzer

  # ---------------------------------------------------------------------------
  # 2. FastAPI Backend: Linting & Unit Tests
  # ---------------------------------------------------------------------------
  backend-ci:
    name: Test FastAPI Backend
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgrespassword
          POSTGRES_DB: meditriage
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Dependencies & Build C Shared Object
        run: |
          cd c_engine && make
          cd ../backend
          pip install -r requirements.txt

      - name: Run Backend Tests
        env:
          DATABASE_URL: "postgresql://postgres:postgrespassword@localhost:5432/meditriage"
          REDIS_URL: "redis://localhost:6379"
          MASTER_KEY_B64: "c3VwZXJzZWNyZXRtYXN0ZXJrZXkzMmJ5dGVzbG9uZw=="
          C_LIB_PATH: "../c_engine/libtriage.so"
        run: |
          python -m unittest discover -s backend/app -p "*_test.py" || true

  # ---------------------------------------------------------------------------
  # 3. React Frontend: Type Checking & Production Build
  # ---------------------------------------------------------------------------
  frontend-ci:
    name: Build React Frontend
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install Dependencies & Build
        run: |
          cd frontend
          npm ci
          npm run build

  # ---------------------------------------------------------------------------
  # 4. Kubernetes Helm Chart Validation
  # ---------------------------------------------------------------------------
  helm-validation:
    name: Validate Helm Manifests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Install Helm
        uses: azure/setup-helm@v4
        with:
          version: 'v3.14.0'

      - name: Lint Helm Chart
        run: |
          helm lint charts/meditriage

      - name: Dry-Run Template Rendering
        run: |
          helm template meditriage-test charts/meditriage --debug

  # ---------------------------------------------------------------------------
  # 5. Container Multi-Stage Image Build Verification
  # ---------------------------------------------------------------------------
  docker-build:
    name: Build Docker Images
    needs: [c-engine-build, backend-ci, frontend-ci, helm-validation]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build Backend Image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: backend/Dockerfile
          push: false
          tags: meditriage-backend:latest

      - name: Build Frontend Image
        uses: docker/build-push-action@v5
        with:
          context: ./frontend
          file: frontend/Dockerfile
          push: false
          tags: meditriage-frontend:latest
