replicaCount: 3

image:
  repository: meditriage-backend
  pullPolicy: IfNotPresent
  tag: "latest"

env:
  databaseUrl: "postgresql://postgres:postgres@postgres-service:5432/postgres"
  redisUrl: "redis://redis-service:6379"

secrets:
  # Base64 encoded 32-byte AES key
  masterKeyB64: "c3VwZXJzZWNyZXRtYXN0ZXJrZXkzMmJ5dGVzbG9uZw=="

resources:
  limits:
    cpu: "1000m"
    memory: "512Mi"
  requests:
    cpu: "250m"
    memory: "128Mi"

autoscaling:
  enabled: true
  minReplicas: 3
  maxReplicas: 20
  targetCPUUtilizationPercentage: 70
  targetMemoryUtilizationPercentage: 80

podDisruptionBudget:
  minAvailable: 2

service:
  type: ClusterIP
  port: 8000
